.title{font-weight:650;font-size:.98rem;line-height:1.35;color:var(--fg);margin:0;word-break:break-word}

const ALL_KEY = '__all__';
let activeGroup = ALL_KEY;

function label(u) {
  const url = new URL(u);
  let seg = url.pathname.split('/').filter(Boolean).pop() || '';
  seg = decodeURIComponent(seg).replace(/\.html$/, '');
  if (!seg || seg === 'index') return url.hostname;
  seg = seg.replace(/[-_]+/g, ' ').trim();
  return seg.charAt(0).toUpperCase() + seg.slice(1);
}

function groupOf(u) {
  const h = new URL(u).hostname;
  return (h === 'kangruli.web.id' || h === 'www.kangruli.web.id')
    ? 'Blog utama'
    : h.replace('.kangruli.web.id', '');
}

function groupLabel(g) {
  return g === 'Blog utama' ? 'Blog utama' : g.charAt(0).toUpperCase() + g.slice(1);
}

    if (b === 'Blog utama') return 1;
    return a.localeCompare(b);

    const b = document.createElement('button');
    b.className = 'chip' + (key === activeGroup ? ' active' : '');
    b.textContent = text + ' · ' + count;
    b.dataset.key = key;
    b.addEventListener('click', () => {
      activeGroup = key;
      wrap.querySelectorAll('.chip').forEach(c => c.classList.toggle('active', c.dataset.key === key));
      render(document.getElementById('q').value);
    });
    return b;
  };
  wrap.appendChild(makeChip(ALL_KEY, 'Semua', LINKS.length));
  groups.forEach(g => {
    wrap.appendChild(makeChip(g, groupLabel(g), LINKS.filter(u => groupOf(u) === g).length));
  });
  document.getElementById('statSites').textContent = groups.length;
  document.getElementById('statTotal').textContent = LINKS.length;
}

function render(query) {
  const sections = document.getElementById('sections');
  const f = query.trim().toLowerCase();
  const groups = {};
  let shown = 0;

  LINKS.forEach(u => {
    const g = groupOf(u);
    if (activeGroup !== ALL_KEY && g !== activeGroup) return;
    if (f && !(label(u) + ' ' + u).toLowerCase().includes(f)) return;
    (groups[g] = groups[g] || []).push(u);
    shown++;
  });

  const keys = Object.keys(groups).sort((a, b) => {
    if (a === 'Blog utama') return -1;
    if (b === 'Blog utama') return 1;
    return a.localeCompare(b);
  });

  sections.textContent = '';
  keys.forEach(g => {
    const sec = document.createElement('section');
    sec.className = 'section';

    const title = document.createElement('h2');
    title.className = 'section-title';
    title.textContent = groupLabel(g);
    const cnt = document.createElement('span');
    cnt.className = 'count';
    cnt.textContent = groups[g].length;
    title.appendChild(cnt);
    sec.appendChild(title);

    const grid = document.createElement('div');
    grid.className = 'grid';
    groups[g].forEach(u => {
      const a = document.createElement('a');
      a.className = 'card';
      a.href = u;
      a.target = '_blank';
      a.rel = 'noopener';

      const top = document.createElement('div');
      top.className = 'card-top';
      const host = document.createElement('span');
      host.className = 'host';
      host.textContent = new URL(u).hostname;
      const arrow = document.createElement('span');
      arrow.className = 'arrow';
      arrow.textContent = '↗';
      top.append(host, arrow);

      const t = document.createElement('p');
      t.className = 'title';
      t.textContent = label(u);

      const url = document.createElement('span');
      url.className = 'url';
      url.textContent = u;

      a.append(top, t, url);
      grid.appendChild(a);
    });
    sec.appendChild(grid);
    sections.appendChild(sec);
  });

  document.getElementById('count').textContent =
    'Menampilkan ' + shown + ' dari ' + LINKS.length + ' tautan';
  document.getElementById('empty').classList.toggle('show', shown === 0);
}

document.getElementById('q').addEventListener('input', e => render(e.target.value));

const toTop = document.getElementById('toTop');
window.addEventListener('scroll', () => toTop.classList.toggle('show', window.scrollY > 400));
toTop.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));

buildFilters();
render('');
</script>
</body>
</html>
